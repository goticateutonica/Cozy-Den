<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas compartidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --ink: #13231f;
    --muted: #5f716b;
    --line: #d3ddd9;
    --mine: #1f6f5c;
    --mine-ink: #ffffff;
    --danger: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a17;
      --surface: #182622;
      --ink: #e6efec;
      --muted: #8fa39c;
      --line: #284039;
      --mine: #2f8f77;
      --mine-ink: #ffffff;
      --danger: #f2877f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Ingreso */
  #login {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-box { width: 100%; max-width: 360px; }
  .login-box h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .login-box p { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; }
  input[type=email], input[type=password] {
    width: 100%;
    padding: 11px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--mine);
    color: var(--mine-ink);
    font-weight: 700;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--danger); font-size: 0.9rem; min-height: 1.3em; margin: 10px 0 0; }

  /* App */
  #app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  header .who { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); }
  .link {
    background: none; border: 0; padding: 4px; cursor: pointer;
    color: var(--muted); text-decoration: underline; font-size: 0.9rem;
  }
  #feed {
    flex: 1; overflow-y: auto;
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 26ch; }
  .note {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    overflow-wrap: anywhere;
  }
  .note.mine {
    align-self: flex-end;
    background: var(--mine);
    border-color: var(--mine);
    color: var(--mine-ink);
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 4px;
  }
  .note .text { white-space: pre-wrap; }
  .note .meta {
    display: flex; gap: 10px; align-items: center;
    margin-top: 6px; font-size: 0.78rem; opacity: 0.75;
  }
  .note .del {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: inherit; text-decoration: underline; font-size: inherit;
  }

  form#composer {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 18px 16px;
    border-top: 1px solid var(--line);
  }
  textarea#texto {
    flex: 1; resize: none; max-height: 140px;
    padding: 11px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  form#composer .btn { width: auto; padding: 11px 20px; }
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="loginForm">
    <h1>Notas compartidas</h1>
    <p>Ingresá con tu correo para ver y enviar notas.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Ingresar</button>
    <p class="error" id="loginError" role="alert"></p>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <h1>Notas compartidas</h1>
    <div class="who">
      <span id="quien"></span>
      <button class="link" id="salir" type="button">Salir</button>
    </div>
  </header>
  <div id="feed" aria-live="polite"></div>
  <form id="composer">
    <textarea id="texto" rows="1" placeholder="Escribí una nota…" aria-label="Nueva nota" maxlength="2000"></textarea>
    <button class="btn" type="submit">Enviar</button>
  </form>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== PEGÁ ACÁ TU CONFIGURACIÓN DE FIREBASE =====
  const firebaseConfig = {
    apiKey: "PEGAR_AQUI",
    authDomain: "PEGAR_AQUI",
    projectId: "PEGAR_AQUI",
    storageBucket: "PEGAR_AQUI",
    messagingSenderId: "PEGAR_AQUI",
    appId: "PEGAR_AQUI"
  };
  // =================================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const loginSec = $("login"), appSec = $("app");
  const feed = $("feed"), texto = $("texto");
  let unsub = null;

  const errores = {
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/invalid-email": "El correo no es válido.",
    "auth/user-disabled": "Esta cuenta está deshabilitada.",
    "auth/too-many-requests": "Demasiados intentos. Esperá unos minutos y probá de nuevo.",
    "auth/network-request-failed": "No hay conexión. Revisá tu internet."
  };

  function nombreDe(email) {
    const base = (email || "").split("@")[0];
    return base ? base.charAt(0).toUpperCase() + base.slice(1) : "Alguien";
  }

  function formatoFecha(d) {
    if (!d) return "enviando…";
    const hoy = new Date();
    const hora = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
    return d.toDateString() === hoy.toDateString()
      ? hora
      : d.toLocaleDateString("es", { day: "numeric", month: "short" }) + ", " + hora;
  }

  // Ingreso
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true;
    $("loginError").textContent = "";
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    } catch (err) {
      $("loginError").textContent = errores[err.code] || "No se pudo ingresar. Probá de nuevo.";
    } finally {
      btn.disabled = false;
    }
  });

  $("salir").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) {
      appSec.classList.add("hidden");
      loginSec.classList.remove("hidden");
      $("pass").value = "";
      return;
    }
    loginSec.classList.add("hidden");
    appSec.classList.remove("hidden");
    $("quien").textContent = nombreDe(user.email);
    escuchar(user);
    texto.focus();
  });

  // Notas en tiempo real
  function escuchar(user) {
    const q = query(collection(db, "notas"), orderBy("creado", "asc"));
    unsub = onSnapshot(q, (snap) => {
      const cerca = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
      feed.replaceChildren();

      if (snap.empty) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Todavía no hay notas. Escribí la primera abajo.";
        feed.appendChild(p);
        return;
      }

      snap.forEach((d) => {
        const n = d.data({ serverTimestamps: "estimate" });
        const mia = n.uid === user.uid;

        const caja = document.createElement("div");
        caja.className = "note" + (mia ? " mine" : "");

        const t = document.createElement("div");
        t.className = "text";
        t.textContent = n.texto;

        const meta = document.createElement("div");
        meta.className = "meta";
        const quien = document.createElement("span");
        quien.textContent = mia ? "Vos" : n.autor;
        const cuando = document.createElement("span");
        cuando.textContent = formatoFecha(n.creado ? n.creado.toDate() : null);
        meta.append(quien, cuando);

        if (mia) {
          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "Borrar";
          del.addEventListener("click", async () => {
            if (!confirm("¿Borrar esta nota?")) return;
            try { await deleteDoc(doc(db, "notas", d.id)); }
            catch { alert("No se pudo borrar la nota. Probá de nuevo."); }
          });
          meta.appendChild(del);
        }

        caja.append(t, meta);
        feed.appendChild(caja);
      });

      if (cerca) feed.scrollTop = feed.scrollHeight;
    }, () => {
      feed.replaceChildren();
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No se pudieron cargar las notas. Revisá tu conexión y las reglas de Firestore.";
      feed.appendChild(p);
    });
    setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 400);
  }

  // Enviar
  async function enviar() {
    const user = auth.currentUser;
    const contenido = texto.value.trim();
    if (!user || !contenido) return;
    texto.value = "";
    autoAltura();
    try {
      await addDoc(collection(db, "notas"), {
        texto: contenido,
        uid: user.uid,
        autor: nombreDe(user.email),
        creado: serverTimestamp()
      });
      feed.scrollTop = feed.scrollHeight;
    } catch {
      texto.value = contenido;
      alert("No se pudo enviar la nota. Probá de nuevo.");
    }
  }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); enviar(); });
  texto.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
  });

  function autoAltura() {
    texto.style.height = "auto";
    texto.style.height = Math.min(texto.scrollHeight, 140) + "px";
  }
  texto.addEventListener("input", autoAltura);
</script>
</body>
</html>
