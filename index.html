main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 14px}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:20px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.hero small{opacity:.85}
.hero p{font-size:1.35rem;font-weight:600;margin:8px 0;word-break:break-word}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;cursor:pointer}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.chip:active{background:var(--mine)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;resize:none;min-height:44px;outline:none}
.send{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.send:disabled{opacity:.5}
h2{font-size:.95rem;color:var(--mute);margin:22px 0 8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.note.mine{background:var(--mine)}
.note p{margin:2px 0;word-break:break-word;white-space:pre-wrap}
.meta{font-size:.78rem;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.del{background:none;border:0;color:var(--mute);padding:0}
#status{color:var(--mute);font-size:.9rem;margin:10px 0}
[hidden]{display:none!important}
.hero img,.note img{display:block;width:100%;height:auto;max-height:480px;object-fit:contain;border-radius:12px;margin:8px 0}
.preview{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:10px;margin:0}
.box .chip{padding:9px 12px}

.top{display:flex;justify-content:space-between;align-items:center}
.top h1{margin:4px 0 14px}
.login{max-width:520px;margin:0 auto;padding:16px}
.login label{display:block;font-size:.9rem;color:var(--mute)}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 14px}
.login .send{width:100%;padding:12px}
.login p.lead{color:var(--mute);margin:0 0 18px}
#loginError{color:#c0392b;min-height:1.3em;margin:10px 0 0;font-size:.9rem}
@media (prefers-color-scheme:dark){#loginError{color:#ff9d92}}
</style>
</head>
<body>
<section id="login" class="login" hidden>
  <form id="loginForm">
    <h1>🦉 Cozy Den</h1>
    <p class="lead">Ingresa con tu correo para ver y enviar notas.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="send" id="loginBtn" type="submit">Ingresar</button>
    <p id="loginError" role="alert"></p>
  </form>
</section>
<main id="app" hidden>
  <div class="top"><h1>🦉 Cozy Den</h1><button id="logout" class="del" type="button">Salir</button></div>
  <section class="hero" aria-live="polite">
    <small id="heroMeta">Aún no hay notas</small>
    <p id="heroText">Escribe la primera nota para tu batatita 💗</p>
    <img id="heroImg" alt="Foto de la nota" hidden>
    <small id="heroBy"></small>
  </section>

  <div class="quick" id="quick"></div>

  <div id="preview" class="preview" hidden><img id="prevImg" alt="Vista previa"><button id="rmPhoto" class="del" type="button">Quitar foto</button></div>
  <div class="box">
    <button class="chip" id="photoBtn" type="button" aria-label="Agregar foto">📷</button>
    <input id="file" type="file" accept="image/*" hidden>
    <textarea id="txt" rows="2" maxlength="500" placeholder="Escribe algo bonito…"></textarea>
    <button class="send" id="send" disabled>Enviar</button>
  </div>

  <div id="status"></div>
  <h2>Historial</h2>
  <div id="list"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (la misma que ya usas) =====
const firebaseConfig = {
  apiKey: "AIzaSyBOdKVYG1fHIGPsGbwlGosmdxOj9Qq10co",
  authDomain: "cozy-den-a35dd.firebaseapp.com",
  projectId: "cozy-den-a35dd",
  storageBucket: "cozy-den-a35dd.firebasestorage.app",
  messagingSenderId: "788062063162",
  appId: "1:788062063162:web:ec541ff1db57023bb48303"
};
// ========================================================================

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const $ = s => document.querySelector(s);
const QUICK = ["💗 Pensando en ti","☀️ Buenos días","🌙 Buenas noches","😘 Te extraño","💬 ¿Cómo estás hoy?"];
let me = null, myName = "", docs = [], unsub = null, pendingPhoto = null;

const ERRORES = {
  "auth/invalid-credential": "Correo o contraseña incorrectos.",
  "auth/invalid-email": "El correo no es válido.",
  "auth/user-disabled": "Esta cuenta está deshabilitada.",
  "auth/too-many-requests": "Demasiados intentos. Espera unos minutos y prueba de nuevo.",
  "auth/network-request-failed": "No hay conexión. Revisa tu internet."
};

function status(t){ $("#status").textContent = t; }
function nombreDe(email){
  const b = (email || "").split("@")[0];
  return b ? b.charAt(0).toUpperCase() + b.slice(1) : "Alguien";
}
function when(ms){
  const d = new Date(ms), now = new Date();
  const hm = d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
  return d.toDateString() === now.toDateString() ? "hoy " + hm : d.toLocaleDateString("es",{day:"numeric",month:"short"}) + " " + hm;
}
function who(n){ return n.uid === me ? "Tú" : (n.autor || "Tu pareja"); }
function ms(n){ return n.creado ? n.creado.toMillis() : Date.now(); }

function render(){
  const list = $("#list"); list.textContent = "";
  docs.forEach(d => {
    const n = d.data({ serverTimestamps: "estimate" }), div = document.createElement("div");
    div.className = "note" + (n.uid === me ? " mine" : "");
    const p = document.createElement("p"); p.textContent = n.texto || ""; p.hidden = !n.texto;
    const m = document.createElement("div"); m.className = "meta";
    const s = document.createElement("span"); s.textContent = who(n) + " · " + when(ms(n));
    m.appendChild(s);
    if (n.uid === me) {
      const b = document.createElement("button"); b.className = "del"; b.textContent = "Borrar";
      b.onclick = () => { if (confirm("¿Borrar esta nota?")) deleteDoc(doc(db, "notas", d.id)).catch(() => status("No se pudo borrar.")); };
      m.appendChild(b);
    }
    div.append(p);
    if (n.foto) { const im = document.createElement("img"); im.src = n.foto; im.alt = "Foto"; div.append(im); }
    div.append(m); list.appendChild(div);
  });
  const last = docs.find(d => d.data().uid !== me) || docs[0];
  if (last) {
    const n = last.data({ serverTimestamps: "estimate" });
    $("#heroMeta").textContent = n.uid === me ? "Tu última nota" : "Nota de tu pareja";
    $("#heroText").textContent = n.texto || "📷 Foto";
    const hi = $("#heroImg");
    if (n.foto) { hi.src = n.foto; hi.hidden = false; } else { hi.hidden = true; }
    $("#heroBy").textContent = who(n) + " · " + when(ms(n));
  }
}

function updateSend(){ $("#send").disabled = !(($("#txt").value.trim() || pendingPhoto) && me); }

async function send(text){
  text = text.trim();
  if ((!text && !pendingPhoto) || !me) return;
  try {
    const note = { texto: text, uid: me, autor: myName, creado: serverTimestamp() };
    if (pendingPhoto) note.foto = pendingPhoto;
    await addDoc(collection(db, "notas"), note);
    $("#txt").value = ""; clearPhoto(); updateSend(); status("");
  } catch (e) {
    status("No se pudo enviar. Revisa tu conexión y las reglas de Firestore.");
  }
}

QUICK.forEach(q => {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = q;
  b.onclick = () => send(q); $("#quick").appendChild(b);
});
$("#txt").addEventListener("input", updateSend);
$("#send").onclick = () => send($("#txt").value);

function clearPhoto(){ pendingPhoto = null; $("#preview").hidden = true; $("#prevImg").removeAttribute("src"); $("#file").value = ""; }
function shrink(file){
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let max = 900, q = 0.7, out = "";
      for (let i = 0; i < 6; i++) {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q);
        if (out.length < 170000) break;
        max *= 0.8; q -= 0.06;
      }
      URL.revokeObjectURL(url);
      out.length < 200000 ? ok(out) : fail();
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  });
}
$("#photoBtn").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    pendingPhoto = await shrink(f);
    $("#prevImg").src = pendingPhoto; $("#preview").hidden = false;
    updateSend(); status("");
  } catch (_) { status("No se pudo preparar la foto. Prueba con otra."); }
};
$("#rmPhoto").onclick = () => { clearPhoto(); updateSend(); };

// Ingreso y salida
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginError").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value);
  } catch (err) {
    $("#loginError").textContent = ERRORES[err.code] || ("No se pudo ingresar (" + (err.code || err.message) + ").");
  } finally { btn.disabled = false; }
});
$("#logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    me = null; docs = [];
    $("#app").hidden = true; $("#login").hidden = false; $("#pass").value = "";
    return;
  }
  me = user.uid; myName = nombreDe(user.email);
  $("#login").hidden = true; $("#app").hidden = false; status("");
  updateSend();
  const q = query(collection(db, "notas"), orderBy("creado", "desc"), limit(60));
  unsub = onSnapshot(q, snap => { docs = snap.docs; render(); },
    () => status("No se pudieron cargar las notas. Revisa tu conexión y las reglas de Firestore."));
});
</script>
</body>
</html>
